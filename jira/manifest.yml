modules:
  jira:adminPage:
    - key: settings
      title: shipmill Release Decisions
      resource: admin
      resolver:
        function: settings-resolver
      render: native
  jira:projectPage:
    - key: release-panel
      title: Release decisions
      resource: release
      resolver:
        function: panel-resolver
      render: native
  webtrigger:
    - key: bridge
      function: on-bridge-request
      response:
        type: dynamic
    - key: dev
      function: on-dev-request
      response:
        type: dynamic
  trigger:
    - key: comment-trigger
      function: on-comment
      events:
        - avi:jira:commented:issue
      filter:
        ignoreSelf: true
  consumer:
    - key: eval-consumer
      queue: eval-cases
      function: on-eval-case
    - key: relay-consumer
      queue: relay-replies
      function: on-relay-reply
    - key: prepare-consumer
      queue: prepare-releases
      function: on-prepare-release
  llm:
    - key: decisions-llm
      model:
        - claude
  function:
    - key: on-bridge-request
      handler: index.onBridgeRequest
    - key: settings-resolver
      handler: index.settingsResolver
    - key: panel-resolver
      handler: index.panelResolver
    - key: on-dev-request
      handler: index.onDevRequest
    - key: on-eval-case
      handler: index.onEvalCase
      timeoutSeconds: 300
    - key: on-comment
      handler: index.onComment
    - key: on-relay-reply
      handler: index.onRelayReply
      timeoutSeconds: 120
    - key: on-prepare-release
      handler: index.onPrepareRelease
      timeoutSeconds: 600
resources:
  - key: admin
    path: src/frontend/admin.tsx
  - key: release
    path: src/frontend/release.tsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/e68108c0-f2e4-427b-9417-b3878322c288
