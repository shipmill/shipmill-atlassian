modules:
  jira:adminPage:
    - key: settings
      title: shipmill Release Decisions
      resource: admin
      resolver:
        function: settings-resolver
      render: native
  jira:projectPage:
    - key: release-panel
      title: Release decisions
      resource: release
      resolver:
        function: panel-resolver
      render: native
  webtrigger:
    - key: bridge
      function: on-bridge-request
      response:
        type: dynamic
    - key: dev
      function: on-dev-request
      response:
        type: dynamic
  trigger:
    - key: comment-trigger
      function: on-comment
      events:
        - avi:jira:commented:issue
      filter:
        ignoreSelf: true
  consumer:
    - key: eval-consumer
      queue: eval-cases
      function: on-eval-case
    - key: relay-consumer
      queue: relay-replies
      function: on-relay-reply
    - key: prepare-consumer
      queue: prepare-releases
      function: on-prepare-release
    - key: decision-log-consumer
      queue: decision-log
      function: on-decision-log
  # The question records live in each work item's shipmill-questions property
  # (jira/src/question.ts). Jira indexes these fields of it, all about the item's current
  # question, so the questions waiting in a project are one JQL search (question-reads.ts)
  jira:entityProperty:
    - key: question-index
      entityType: issue
      propertyKey: shipmill-questions
      values:
        - path: status
          type: string
          searchAlias: agentQuestionStatus
        - path: askedOf
          type: string
          searchAlias: agentQuestionAskedOf
        - path: askedBy
          type: string
          searchAlias: agentQuestionAskedBy
        - path: answered
          type: number
          searchAlias: agentQuestionsAnswered
  # MCP: a coding agent lists a release's blocking decisions, asks a question and reads its answer.
  # Tools are the actions below; an admin exposes them per site (see README, "Ask from a
  # coding agent through MCP"). Each runs for the caller and checks their Jira permissions.
  action:
    - key: list-release-decisions
      name: List release decisions
      function: mcp-list-decisions
      actionVerb: GET
      description: >
        List a Jira fix version's blocking decisions and the open fix versions. ready is true
        when nothing blocks, false when something does, unknown when no work item blocks but
        pull request data could not be read.
      inputs:
        project:
          title: Project key
          type: string
          required: true
          description: "The Jira project key, for example HRB"
        version:
          title: Fix version
          type: string
          required: false
          description: "The fix version name, for example 2.4; the project's first open version when left out"
    - key: ask-decision
      name: Ask a question on a work item
      function: mcp-ask-decision
      actionVerb: CREATE
      description: >
        Ask a person a question on a Jira work item: give question, options and agent, and
        recommended with reason where you can. Posted as a comment with numbered options;
        not asked twice. Without question, version asks a prepared release decision.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: "The work item the question is about, for example HRB-2"
        question:
          title: Question
          type: string
          required: false
          description: "Your question in one sentence, ending with a question mark"
        options:
          title: Options
          type: string
          required: false
          description: "Two to four options, one per line, in the order they are numbered"
        recommended:
          title: Recommended option
          type: integer
          required: false
          description: "The number of the option you recommend, from 1; leave out when you recommend none"
        reason:
          title: Reason
          type: string
          required: false
          description: "Why you recommend that option, in one sentence; required with recommended"
        care:
          title: Routine or careful
          type: string
          required: false
          description: "routine or careful. careful (the default): irreversible, breaking, or outside your mandate, so it is never answered in a batch"
        agent:
          title: Agent
          type: string
          required: false
          description: "Which agent asks, for example Claude Code; required with question"
        version:
          title: Fix version
          type: string
          required: false
          description: "Only without question: the open fix version whose blocking decision to ask, for example 2.4"
    - key: read-decision-answer
      name: Read a decision's answer
      function: mcp-read-answer
      actionVerb: GET
      description: >
        Read where the question asked on a Jira work item stands, from its record: not-asked,
        waiting (the question, its numbered options and who it waits on), answered (the
        answer, who gave it and when), answered-from-record or withdrawn.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: "The work item the question was asked on, for example HRB-2"
  rovo:mcp:
    - key: release-decisions-mcp
      name: shipmill Release Decisions
      tools:
        - list-release-decisions
        - ask-decision
        - read-decision-answer
  llm:
    - key: decisions-llm
      model:
        - claude
  function:
    - key: on-bridge-request
      handler: index.onBridgeRequest
    - key: settings-resolver
      handler: index.settingsResolver
    - key: panel-resolver
      handler: index.panelResolver
    - key: on-dev-request
      handler: index.onDevRequest
    - key: on-eval-case
      handler: index.onEvalCase
      timeoutSeconds: 300
    - key: on-comment
      handler: index.onComment
    - key: on-relay-reply
      handler: index.onRelayReply
      timeoutSeconds: 120
    - key: on-prepare-release
      handler: index.onPrepareRelease
      timeoutSeconds: 600
    - key: on-decision-log
      handler: index.onDecisionLog
    - key: mcp-list-decisions
      handler: index.mcpListDecisions
    - key: mcp-ask-decision
      handler: index.mcpAskDecision
    - key: mcp-read-answer
      handler: index.mcpReadAnswer
resources:
  - key: admin
    path: src/frontend/admin.tsx
  - key: release
    path: src/frontend/release.tsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    # Confluence decision log (jira/src/confluence.ts): find the space, find, create and update its page
    - read:space:confluence
    - read:page:confluence
    - write:page:confluence
    # Teamwork Graph: only the object types the preparer's queries traverse (jira/src/graph.ts)
    - read:graph:issue:jira
    - read:graph:pull-request:external
    - read:graph:deployment:external
    - read:graph:team:atlassian
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/e68108c0-f2e4-427b-9417-b3878322c288
