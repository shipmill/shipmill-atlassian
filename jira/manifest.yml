modules:
  jira:adminPage:
    - key: settings
      title: shipmill Release Decisions
      resource: admin
      resolver:
        function: settings-resolver
      render: native
  webtrigger:
    - key: bridge
      function: on-bridge-request
      response:
        type: dynamic
    - key: dev
      function: on-dev-request
      response:
        type: dynamic
  consumer:
    - key: eval-consumer
      queue: eval-cases
      function: on-eval-case
  llm:
    - key: decisions-llm
      model:
        - claude
  function:
    - key: on-bridge-request
      handler: index.onBridgeRequest
    - key: settings-resolver
      handler: index.settingsResolver
    - key: on-dev-request
      handler: index.onDevRequest
    - key: on-eval-case
      handler: index.onEvalCase
      timeoutSeconds: 300
resources:
  - key: admin
    path: src/frontend/admin.tsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/e68108c0-f2e4-427b-9417-b3878322c288
